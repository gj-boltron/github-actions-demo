name: Setup TypeScript project
description: Installs pnpm and Node.js, then the ts-app dependencies (with pnpm store cache).

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setup
    default: "true"
  cache:
    description: Restore/save the pnpm store cache (set "false" for release builds)
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm (version from package.json "packageManager")
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ts-app/package.json

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ts-app/pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ts-app
      run: pnpm install --frozen-lockfile
