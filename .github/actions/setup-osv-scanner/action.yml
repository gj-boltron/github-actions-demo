name: Setup OSV-Scanner
description: Downloads Google's OSV-Scanner, verifies its SHA-256 checksum and installs it to /usr/local/bin.

runs:
  using: composite
  steps:
    - name: Install osv-scanner
      shell: bash
      env:
        # Bump both values together: https://github.com/google/osv-scanner/releases
        OSV_SCANNER_VERSION: v2.7.0
        OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
      run: |
        download="$RUNNER_TEMP/osv-scanner"
        curl -fsSL -o "$download" \
          "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
        echo "${OSV_SCANNER_SHA256}  ${download}" | sha256sum --check --strict
        # /usr/local/bin is already on PATH, so no write to GITHUB_PATH is needed
        sudo install -m 0755 "$download" /usr/local/bin/osv-scanner
        osv-scanner --version
