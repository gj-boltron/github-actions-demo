name: TS CI

on:
  push:
    branches: [main]
    paths:
      - "ts-app/**"
      - ".github/workflows/ts-ci.yml"
      - ".github/actions/setup-ts/**"
  pull_request:
    paths:
      - "ts-app/**"
      - ".github/workflows/ts-ci.yml"
      - ".github/actions/setup-ts/**"
  workflow_dispatch:
  # Lets ts-deploy.yml run the exact same checks before deploying
  workflow_call:

# Least privilege: nothing by default, each job asks for what it needs
permissions: {}

concurrency:
  # Cancel superseded PR runs; never cancel runs on main or calls from the deploy workflow
  group: ${{ github.event_name == 'pull_request' && format('ts-ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ts-app

jobs:
  format:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ts
      - run: pnpm format:check

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ts
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ts
      - run: pnpm typecheck

  test:
    name: Unit test (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ts
      - run: pnpm test:coverage
      - name: Upload coverage and JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-app-test-reports
          path: |
            ts-app/coverage/
            ts-app/reports/
          retention-days: 7

  e2e:
    name: E2E test (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ts
      # Browser + its Linux system libraries; the version always matches @playwright/test
      - run: pnpm e2e:install
      # Non-interactive run: builds and starts the server, runs headless Chromium.
      # CI=true (set by GitHub) turns on retries and forbids test.only
      - run: pnpm e2e
      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-app-e2e-report
          path: |
            ts-app/playwright-report/
            ts-app/test-results/
            ts-app/reports/
          retention-days: 7

  audit:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ts
        with:
          install: "false" # audit only reads pnpm-lock.yaml
      - run: pnpm audit --audit-level high

  build:
    name: Build package
    needs: [format, lint, typecheck, test, e2e, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ts
      # Proves the package builds and packs; ts-deploy.yml builds the released copy itself
      - run: pnpm build
      - name: Pack tarball
        run: pnpm pack --pack-destination ../out
